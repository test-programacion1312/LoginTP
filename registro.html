<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    <link rel="stylesheet" href="estilos.css">
    <script type="module" src="scriptregist.js"></script>
</head>
<body>
    <div class="form-container">
        <h2>Registrarse</h2>
        <form id="contact-form">
            
            <label>Nombre</label>
            <input type="text" id="name" name="name" required>

            <label>Apellido:</label>
            <input type="text" id="apell" name="apell" required>

            <label>Correo electrónico:</label>
            <input type="email" id="email" name="email" required>

            <label>Contraseña:</label>
            <input type="password" id="password" name="password" required>

            <label>Repetir contraseña:</label>
            <input type="password" id="cont2" name="cont2" required>


            <button type="submit" id="button">Registrarse</button>
            <br><br>
  <label for="registrar"><a href="index.html">Iniciar Sesión</a></label>
  <br><br>
  <label for="reset"><a href="rcontra.html">¿Olvidaste tu contraseña?</a></label>
  </form>
</body>
</html>
